<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-labelledby="title desc">
  <title id="title">用叉乘判断点在三角形内还是外</title>
  <desc id="desc">沿 A、B、C 的逆时针顺序检查三条边。左图的点 P 在内部，AB 与 AP、BC 与 BP、CA 与 CP 的叉乘的 z 分量均为正。右图的点 P 在 BC 右侧，该项为负，所以点在外部。坐标方向为 x 向右、y 向上。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#245f99"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b54c28"/>
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#66717e"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #202a35; }
      .heading { font-size: 22px; font-weight: 600; }
      .note { font-size: 17px; fill: #53606c; }
      .caption { font-family: "SimHei", "Heiti SC", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #354b61; }
      .caption-label { font-family: "SimHei", "Heiti SC", "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #fff; }
      .point { font-family: "Times New Roman", serif; font-size: 25px; font-style: italic; }
      .formula { font-family: "Times New Roman", serif; font-size: 23px; }
      .edge { stroke: #245f99; stroke-width: 2.8; fill: none; }
      .ray { stroke: #66717e; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#gray-arrow); }
      .positive { fill: #245f99; }
      .negative { fill: #b54c28; }
    </style>
  </defs>
  <rect width="1060" height="560" fill="#fff"/>
  <text x="530" y="35" text-anchor="middle" class="note">沿 A → B → C → A，比较三次叉乘的 z 分量</text>
  <line x1="530" y1="65" x2="530" y2="470" stroke="#dde2e7"/>

  <g transform="translate(40 65)">
    <text x="220" y="25" text-anchor="middle" class="heading">点在三角形内</text>
    <path d="M 65 255 L 355 255 L 210 65 Z" fill="#edf4fa"/>
    <path d="M 65 255 L 210 170 M 355 255 L 210 170 M 210 65 L 210 170" class="ray"/>
    <path d="M 65 255 L 355 255 L 210 65 Z" class="edge"/>
    <path d="M 170 255 L 240 255" class="edge" marker-end="url(#blue-arrow)"/>
    <path d="M 310 196 L 267 140" class="edge" marker-end="url(#blue-arrow)"/>
    <path d="M 165 124 L 122 180" class="edge" marker-end="url(#blue-arrow)"/>
    <g fill="#202a35">
      <circle cx="65" cy="255" r="4"/>
      <circle cx="355" cy="255" r="4"/>
      <circle cx="210" cy="65" r="4"/>
      <circle cx="210" cy="170" r="5"/>
    </g>
    <text x="43" y="279" class="point">A</text>
    <text x="361" y="279" class="point">B</text>
    <text x="221" y="65" class="point">C</text>
    <text x="220" y="166" class="point">P</text>
    <text x="220" y="320" text-anchor="middle" class="formula positive">(AB × AP)<tspan baseline-shift="sub" font-size="16">z</tspan> &gt; 0</text>
    <text x="220" y="354" text-anchor="middle" class="formula positive">(BC × BP)<tspan baseline-shift="sub" font-size="16">z</tspan> &gt; 0</text>
    <text x="220" y="388" text-anchor="middle" class="formula positive">(CA × CP)<tspan baseline-shift="sub" font-size="16">z</tspan> &gt; 0</text>
    <text x="220" y="423" text-anchor="middle" class="note">三次同号，P 在三条有向边的左侧</text>
  </g>

  <g transform="translate(570 65)">
    <text x="220" y="25" text-anchor="middle" class="heading">点在三角形外</text>
    <path d="M 45 255 L 305 255 L 175 65 Z" fill="#edf4fa"/>
    <path d="M 45 255 L 380 145 M 305 255 L 380 145 M 175 65 L 380 145" class="ray"/>
    <path d="M 45 255 L 305 255 M 175 65 L 45 255" class="edge"/>
    <path d="M 305 255 L 175 65" stroke="#b54c28" stroke-width="2.8" fill="none"/>
    <path d="M 145 255 L 210 255" class="edge" marker-end="url(#blue-arrow)"/>
    <path d="M 267 199.5 L 223 135.2" stroke="#b54c28" stroke-width="2.8" fill="none" marker-end="url(#orange-arrow)"/>
    <path d="M 136 122 L 96 180.5" class="edge" marker-end="url(#blue-arrow)"/>
    <g fill="#202a35">
      <circle cx="45" cy="255" r="4"/>
      <circle cx="305" cy="255" r="4"/>
      <circle cx="175" cy="65" r="4"/>
      <circle cx="380" cy="145" r="5"/>
    </g>
    <text x="23" y="279" class="point">A</text>
    <text x="311" y="279" class="point">B</text>
    <text x="186" y="65" class="point">C</text>
    <text x="391" y="149" class="point">P</text>
    <text x="220" y="320" text-anchor="middle" class="formula positive">(AB × AP)<tspan baseline-shift="sub" font-size="16">z</tspan> &gt; 0</text>
    <text x="220" y="354" text-anchor="middle" class="formula negative">(BC × BP)<tspan baseline-shift="sub" font-size="16">z</tspan> &lt; 0</text>
    <text x="220" y="388" text-anchor="middle" class="formula positive">(CA × CP)<tspan baseline-shift="sub" font-size="16">z</tspan> &gt; 0</text>
    <text x="220" y="423" text-anchor="middle" class="note">BC 这一项异号，P 在 BC 的右侧</text>
  </g>

  <g transform="translate(35 455)">
    <path d="M 0 35 L 45 35 M 0 35 L 0 -10" fill="none" stroke="#66717e" stroke-width="1.4" marker-end="url(#gray-arrow)"/>
    <text x="50" y="41" class="point" style="font-size:18px">x</text>
    <text x="-5" y="-17" class="point" style="font-size:18px">y</text>
  </g>
  <rect x="130" y="504" width="800" height="36" rx="4" fill="#f3f5f7"/>
  <rect x="148" y="512" width="48" height="22" rx="3" fill="#53687e"/>
  <text x="172" y="528" text-anchor="middle" class="caption-label">图注</text>
  <text x="210" y="528" class="caption">图中 AB、AP 等均表示有方向的向量；落在边上的情况需单独判断。</text>
</svg>
